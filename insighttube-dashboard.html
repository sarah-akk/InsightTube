    "summary": "**ملخص الفيديو (بالعربية): “The deeper meaning of matrix transpose”**\n\n---\n\n### 1. الفكرة العامة – ما هو الـ transpose حقًا؟\n- يُعرّف الـ **transpose** ليس فقط على أنه “تبديل الصفوف بالأعمدة” في المصفوفة، بل هو **تحويل لآلة قياس (covector)** من فضاء الهدف (codomain) إلى فضاء المنشأ (domain).\n- المصفوفة هي merely **ملخص** للخريطة الخطية: العمود الأول يحدد إلى أين يذهب المتجه \\((1,0)\\)، والعمود الثاني يحدد إلى أين يذهب \\((0,1)\\). من هذين العمودين يمكن استعادة سلوك أي متجه خطي.\n\n### 2. ما هو الـ covector (أو الـ dual, أو 1‑form)؟\n- هو **آلة خطية** تستقبل متجهًا وتُعطي عددًا (قِياسًا).  \n- خاصية الخطية تعني: قياس \\(v_1+v_2 =\\) قياس\\(v_1\\)+قياس\\(v_2\\)، وقياس\\(\\lambda v_1 = \\lambda\\)×قياس\\(v_1\\).\n- بعدán نختار أزمتين أساسيتين \\((1,0)\\) و\\((0,1)\\)، يُقاس covector بـ \\((a,b)\\) بحيث يقيس المتجه \\((x,y)\\) بـ \\(ax+by\\).  \n- تصويرياً، تُمثَّل covector بمستوى (في 2‑بُعد) أو بمستوى متوازٍ (خطوط) أو بمستوى متوازٍ (أسطح) في 3‑بُعد.  \n- **المستوى المتوازي** (أو السطح) يمثل جميع النقاط التي يُعطي فيها covector نفس القيمة \\(c\\). الفجوة بين المستويين تُعطي **كثافة** الخطوط؛ طول المتجه العمودي على هذه المستويات يساوي \\(1/\\)(حجم الفجوة).  \n- لتحديد أي من المتجهين المتعامدين هو المتجه المقابل نحتاج إلى **العلامات** (القيم) على المستويات؛ المتجه الذي يشير نحو القيم الموجبة هو الصحيح.\n\n### 3. تصوير الـ transpose باستخدام covectors\n- لنأخذ خريطة خطية \\(\\alpha: V\\to W\\) ومقيسًا (covector) \\(\\epsilon\\) على \\(W\\).  \n- الهدف من \\(\\alpha^{T}\\) هو إيجاد covector \\(\\eta\\) على \\(V\\) بحيث، لأي متجه \\(v\\in V\\):  \n  \\[\n  \\epsilon(\\alpha(v)) = \\eta(v)\n  \\]\n  بمعنى آخر، **ننقل أداة القياس من الفضاء الهدف إلى الفضاء الأصلي** لنحصل على نفس النتيجة دون الحاجة للذهاب إلى الفضاء الهدف.\n\n- لتنفيذ ذلك بصرياً ننظر إلى covectors الأساسيين \\((1,0)\\) و\\((0,1)\\) (أو ما يقابلهما في الفضاء الهدف).  \n- نראה إلى أين يذهب كل منهما بعد تطبيق \\(\\alpha^{T}\\); العمود الأول من مصفوفة \\(\\alpha^{T}\\) يوضح куда يذهب covector \\((1,0)\\)، والعمود الثاني يوضح куда يذهب covector \\((0,1)\\).\n\n#### أمثلة توضيحية\n1. **القصّ اليميني (right shear)**  \n   - المصفوفة الأصلية: \\(\\begin{pmatrix}1&1\\\\0&1\\end{pmatrix}\\).  \n   - بعد تطبيق \\(\\alpha^{T}\\) نحصل على مصفوفة \\(\\begin{pmatrix}1&0\\\\1&1\\end{pmatrix}\\) (تبديل صفوف وأعمدة).  \n   - بصرياً، هذا يعادل **قصًّا يساريًا** على شبكة الخطوط التي تمثل covectors، مع الحفاظ على نفس القيم المقاسة.\n\n2. **مصفوفة قطريه (diagonal)** – على سبيل المثال \\(\\operatorname{diag}(3,2)\\)  \n   - الفجوة بين الخطوط تقل إلى \\(1/3\\) و\\(1/2\\) على التوالي، لذا يصبح طول المتجه العمودي \\(3\\) و\\(2\\).  \n   - بعد transpose نحصل على نفس المصفوفة لأننا نتعامل مع الخطوط ك covectors؛ swap rows‑columns لا يغير المصفوفة هنا.\n\n3. **الدوران** – دوران بعكس عقارب الساعة 60°  \n   - المصفوفة الأصلية \\(R\\).  \n   - عند تطبيق transpose نحصل على الدوران بعكس الاتجاه (بالعقارب الساعة) 60°، أي \\(R^{T}=R^{-1}\\).  \n   - هنا يتطابق transpose مع العكس لأن الفجوة بين الخطوط لا تتغير بالدوران؛ لذا فإن المتجه العمودي يُدور بنفس الزاوية دون تغيير طوله.\n\n### 4. العلاقة بين transpose والعكس (inverse)\n- عندما تكون الخريطة الخطية **عاكسة** (قابل للعكس)并且 نربط كل covector بمتجه عمودي عليه (كى يكون طوله متناسبًا مع كثافة الخطوط)، فإن عملية تحويل covectors عبر \\(\\alpha^{T}\\) تُقابل تحويل المتجهات عبر \\(\\alpha^{-1}\\).  \n- بالتالي، تحت هذا **التزاوج** (pairing) بين المتجهات والقويسرات، يمكننا كتابة \\(A^{T}=A^{-1}\\). المصفوفات التي تحقق detta تُدعى **متعامدة (orthogonal)**؛ وإطارات الدوران هي مثال典型.\n\n### 5. دقة تقنية هامة – لماذا يساوي transpose العكس رغم أنهما يعملان على كائنات مختلفة؟\n- transpose يعمل على **covectors** (من الفضاء dual إلى نفسه)، بينما العكس يعمل على **vectors**.  \n- equality \\(A^{T}=A^{-1}\\) يصبح معقولا فقط عندما نُحدد **تزاوجًا lineár** между المتجهات والقويسرات (أي نحدد **مترّ metric**):  \n  - المعطى متجه \\((v_1,v_2)\\) نعطيه covector \\((v_1,v_2)\\) (أو نופسّم حسب المختار).  \n  - هذا التزاوج هو ما يُسمى **المترّ metric tensor**; والعكس من covector إلى vecteur يُعطى بواسطة **المترّ العكسي**.  \n- إذا غيّرنا طريقة التزاوج (مثلاً نأخذ \\((-a,b)\\) بدلاً من \\((a,b)\\)) نحصل على هندسات مختلفة؛ في 경우에는 خاصة النسبية (1+1‑أبعاد) يصبح هذا التزاوج هو ما يعطى تحويلات لورنتز.\n\n### 6. ملخص النقاط الأساسية\n- **covector** = أداة قياس خطية للمتجهات.  \n- **transpose** = نقل هذه أداة القياس من فضاء الهدف إلى فضاء المنشأ بحيث تبقى القراءات unchanged.  \n- المصفوفة التي تمثل \\(\\alpha^{T}\\) تُحصل ببساطة بتبديل صفوف وأعمدة المصفوفة التي تمثل \\(\\alpha\\) **عند تمثيل الخريطة كملخص للعمودين الأساسيين**.  \n- في الحالات العاكسة وباستخدام التزاوج الاعتيادي بين المتجهات والقويسرات، يصبح transpose مساويًا للعكس؛ المصفوفات التي تحقق ذلك هي المتعامدة (مثل دوران).  \n- الفكرة العميقة هي أن transpose ليس مجرد عملية حسابية على المصفوفات، بل له معنى هندسي عميق يتعلق بكيفية نقل “أداة القياس” عبر الفراغات المختلفة، وهذه الفكرة تظهر بوضوح في التصوير عبر الخطوط (أو المستويات) المتوازية وتكمُن وراء مفاهيم مثل duality، metric، وحتى تحويلات لورنتز في النظرية النسبية.  \n\nبهذا، يُقدّم الفيديو فهمًا أعمق للـ transpose يتجاوز مجرد تبادل الصفوف بالأعمدة، ويصلبه بمفاهيم الجبر الخطي المتقدم والفيزياء النظرية."

    "summary": "**ملخص الفيديو – “SQLite under the hood in 9 minutes” (بالعربية)**  \n\nSQLite هو أشهر نظام قواعد بيانات مدمج في العالم؛ يوجد في السيارات، الطائرات، الأقمار الصناعية، الهواتف الذكية، إلخ. على عكس قواعد البيانات التقليدية (مثل MySQL أو Postgres) التي تحتاج إلى خادم منفصل واتصال عبر الشبكة، فإن SQLite هو مجرد مكتبة C تُضمَّنُ C تعيش داخل تطبيقك؛ استدعاؤها يشبه استدعاء دالة عادية، ولا تحتاج إلى إدارة اتصالات أو خادم خلفي قد يتعطل.\n\n### كيف يعمل SQLite من الداخل؟\n\n1. **تخزين البيانات**  \n   - كل شيء (الجداول، الفهارس، البيانات) يُحفظ في ملف واحد فقط.  \n   - يُقسم هذا الملف إلى صفحات بحجم ثابت (افتراضيًا 4 KB)، وهي أصغر وحدة للقراءة والكتابة من القرص.\n\n2. **هيكل B+‑tree**  \n   - تُنظَّم الجداول كشجرة B+؛ العقد الورقية تحمل الصفوف الفعلية، بينما تُخزَّن الفهارس كأشجار B+ منفصلة تُعيد مؤشرات الصفوف الداخلية.  \n   - thanks to high fan‑factor (مئات المفاتيح في الصفحة)، تبقى الشجرة مسطحة מאוד (أقل من 4 مستويات لمليار صف)، لذا فإن البحث通常 يتطلب قراءة صفحة واحدة فقط من القرص.\n\n3. **تحويل الاستعلام إلى كود قابل للتنفيذ**  \n   - عندما يُرسل استعلام SQL:  \n     - **التTokenizer** يقسِّم النص إلى رموز.  \n     - **المحلل** يبني شجرة بناء (AST) للتحقق من صحة النحو.  \n     - **مولد الكود** يحول الشجرة إلى “bytecode” (تعليمات منخفضة المستوى) تُشبه برنامجًا صغيرًا.  \n   - يمكن مشاهدة هذه التعليمات باستخدام كلمة `EXPLAIN` قبل الاستعلام؛ تظهر عمليات مثل `OpenRead`, `Column`, `Next` وما إلى ذلك.\n\n4. **محرك قاعدة البيانات الظاهرية (VDBE)**  \n   - يُنفّذ الـ bytecode عبر آلة افتراضية صغيرة تحتوي على سجلات ومؤشرات (cursors).  \n   - الحلقة التنفيذية للاستعلام البسيط `SELECT` تفتح مؤشرًا على الجدول، تعيد أول صف، ثم تعيد قراءة الصف التالي حتى نهاية الجدول.  \n   - العمليات المعقدة (joins, sorts) تُنفَّذ كمزيج من هذه التعليمات الأولية.\n\n5. **ضمان السلامة ضد انقطاع الطاقة**  \n   - **سجل التراجع (Rollback Journal)**: قبل تعديل أي صفحة، يتم نسخ نسختها الأصلية إلى ملف journal مجاور. يُستدعي النظام `fsync` لضمان كتابة journal إلى القرص، ثم تُ-written الصفحات الجديدة إلى الملف الرئيسي ويُستدعى `fsync` ثانيةً. إذا انقطعت الطاقة أثناء العملية، يعيد SQLite عند الإقلاع نسخ الصفحات الأصلية من journal، وبالتالي يتراجع عن العملية غير المكتملة.  \n   - **WAL (Write‑Ahead Logging)** (وضع التسجيل المسبق للكتابة): بدلاً من تعديل الملف الرئيسي مباشرة، تُضاف الإصدارات الجديدة للصفحات إلى ملف log منفصل. القراء يتحققون أولًا من log؛ إذا وجدوا نسخة محدثة يقرأونها، وإلا يقرؤون النسخة القديمة من الملف الرئيسي. هكذا لا يتعارض القراء والكتابون. عند بلوغ log حدًا معينًا (~1000 صفحة)، يتم تنفيذ checkpoint لنقل جميع التغييرات إلى الملف الرئيسي وإعادة تعيين log. لا يزال هناك قفل كتابة حصري (واحد فقط يمكنه الكتابة في كل مرة)؛ إذا حاول أكثر من thread كتابة متزامن، يحصل على خطأ “busy”.\n\n6. **لماذا SQLite ينتشر partout؟**  \n   - لا يتطلب خادمًا ولا إعدادًا ولا شبكة؛ كل شيء داخل ملف واحد.  \n   - الأداء الجيد للقراءات (غالبًا قراءة صفحة واحدة من القرص).  \n   - الضمان القوي للاتساق حتى عند انقطاع الطاقة بفضل journal/WAL.  \n   - ограничение واحد للكتابة في الوقت المناسب يجعله غير مناسب للبيئات ذات الكتابة المكثفة المتزامنة (مثل 50 خادمًا يتشاركون ملفًا عبر الشبكة)، لكنه مثالي للتطبيقات المدمجة والأجهزة المحمولة وأنظمة التشغيل التي تحتاج إلى قاعدة بيانات محلية خفيفة الوزن.\n\n**الخلاصة:**  \nSQLite يحول نص SQL إلى تعليمات منخفضة المستوى تُنفّذ بواسطة آلة افتراضية صغيرة تعمل على شجرة B+ مخزنة في صفحات ثابتة الحجم داخل ملف واحد. يضمن آلية journal (أو WAL) أن تكون جميع التغييرات إما مكتملة بالكامل أو完全退回، مما يوفر مقاومة للعطل دون الحاجة لخادم منفصل. هذه البساطة والموثوقية تجعل SQLite الاختيار الافتراضي لمعظم الأجهزة والتطبيقات التي تحتاج إلى قاعدة بيانات مدمجة."

    "summary": "**ملخص الفيديو (بالعربية):**\n\n- أصدر مختبر الذكاء الاصطناعي الصيني **Moonshot** نموذجًا مفتوح الأوزان يُدعى **Kimi K3** يحتوي على **2.8 تريليون معلمة**، ويُعد أحد أكبر النماذج المفتوحة حتى الآن.\n- Kimi K3 هو نموذج **Mixture‑of‑Experts (MoE)** متعدد النماذج الأصلي، يتمتع بنافذة سياق تصل إلى **مليون توكن**، ويحتوي على **896 خبيرًا** يتم تفعيل **16 خبيرًا فقط لكل توكن** (ما يعادل عمل 16 مبرمجًاproductive بينما يبقى الـ880 خبيرًا الآخرون غير نشطين).\n- благодаря هذه البنية، يصبح التوسع حوالي **2.5 مرة أكثر كفاءة** مقارنة بالإصدار السابق K2.\n- رغم الكفاءة، استهلك النموذج موارد GPU بشكل هائل عند الإطلاق، ما أدى إلى نفاد السعة وبيع جميع الخطط المدفوعة؛ تُتوقعrelease أوزان النموذج في **27 يوليو 2026**، لكنه يحتاج إلى مجموعة ضخمة من وحدات معالجة مراكز البيانات لتشغيله.\n- في الاختبارات، يتفوق Kimi K3 على نماذج مثل **Claude Fable** و**GPT‑5.6 Soul** في منصات مثل **Frontend Code Arena** (تصنيف Elo ≈ 1679) ويอยู่ في top‑3 على مؤشر **Artificial Analysis Intelligence**.\n- nevertheless، يشير المحللون إلى أن بعض النتائج تستفيد من harness داخلي (Kimiko) قد يفضل النموذج؛ كما يُظهر النموذج **معدل هلووسن تصل إلى 51 %** ويتولد عددًا أكبر من التوكنات المطلوبة، مما قد يزيد التكلفة رغم رخص النموذج نفسه.\n- من الناحية الجيوسياسية، استغل الحزب الشيوعي الصيني المؤتمر العالمي للذكاء الاصطناعي للترويج للذكاء الاصطناعي المفتوح والمجاني، بينما تسعى سيليكون فالي والحكومة الأمريكية إلى تنظيم وحظر النماذج الصينية وسط مخاوف من فقدان الوظائف والهجمات السيبرانية؛ فرص الحظر الأمريكي للنماذج الصينية حاليًا حوالي **29 %** وفق أسواق التنبؤ.\n- الإطلاق يعزز سباق التسلح في مجال الذكاء الاصطناعي؛ حيث أصدرت علي بابا أيضًا **Qwen 3.8** بـ2.4 تريليون معلمة وأوزان مفتوحة.\n- الفيديو ينتهي بدعوة لتجربة **Mobbin** (راعي الفيديو) كمصدر لتصاميم واجهات مستخدم مستندة إلى مكتبات شاشة حقيقية لتحسين نتائج الوكلاء الذكاء الاصطناعي في تصميم UI."

    "title": "Freenet - Services Without Servers",
    "url": "https://www.youtube.com/watch?v=3RBNboYUlVI",
    "channel": "FUTO",
    "videoId": "3RBNboYUlVI",
    "hasTranscript": true,
    "summary": "**ملخص الفيديو: “Freenet – Services Without Servers” (بالعربية)**  \n\n- **المشكلة التي يُعالجها Freenet**  \n  - تزايد الرقابة الحكومية على الإنترنت حتى في الديمقراطيات الغربية (المملكة المتحدة، فرنسا، الاتحاد الأوروبي، كاليفورنيا…) عبر اعتقالات، غرامات، وتعديل خوارزميات التوصية بشكل مخفي.  \n  - هذه الرقابة تستغل الاعتماد على خوادم مركزية تديرها شركات يمكن الضغط عليها أو تحريضها من قبل الحكومات.  \n\n- **فكرة Freenet الأساسية**  \n  - شبكة **peer‑to‑peer** لا تحتوي على خوادم مركزية؛ كل عقدة (peer) متكافئة ولا توجد نقطة فشل واحدة.  \n  - من خلال عدم وجود خوادم تُدار من قبل جهة واحدة، يصبح من الصعب على الحكومات ممارسة الضغط أو تعديل المحتوى.  \n  - الشبكة ذاتية التنظيم؛ لا يديرها أي شخص أو جهة، وبالتالي لا يمكن إجبار المطور على حذف شيء من الشبكة.  \n\n- **كيف يعمل Freenet للمستخدم**  \n  - المتصفح يتحدث إلى عقدة Freenet محلية على جهازك بدلاً من الاتصال بخوادم بعيدة عبر HTTPS/WebSockets.  \n  - البيانات المشتركة (العقود) تُخزّن وتوزّع على العقد جميعها؛ إذا تم إيقاف عقدة، تنتقل الأحمال إلى عقد أخرى بشفافية.  \n  - يمكن استخدام Freenet عبر المتصفح (مثل تطبيق River) أو عبر تثبيت العميل المحلي (Quick‑start) ثم نقل البيانات الخاصة إلى عقدتك الخاصة.  \n\n- **المكونات التقنية**  \n  - **العقود (Contracts)**: تخزن الحالة المشتركة والمنطق الذي يحدّث ويتحقق من صحة البيانات (مشابه لجدول قاعدةfilled مع منطق عمل).  \n  - **التمثيليات (Delegates)**: تخزن البيانات الخاصة على جهاز المستخدم وتعمل ككود ويب‑Assembly يحدّد من يمكنه الوصول إلى البيانات أو توقيعها (مشابه لتخزين محلي لكن مع تحكم بالوصول).  \n  - **الشفافية**: كل عقد ومنطقها مفتوح للجميع؛ يمكن مراجعة الكود، تجميعه إلى WebAssembly، وتشغيله على نماذج لغة كبيرة لتدقيق ما يفعله.  \n\n- **التطبيقات المبنية على Freenet**  \n  - **River**: تطبيق دردشة جماعية يدعم غرف خاصة (مفتاحية متماثلة تُدار وتُدور أسبوعياً) ورسائل خاصة. لا يخفي وجود الغرفة لكنه يشفّر محتواها وبياناتها الوصفية.  \n  - **Delta**: أداة لإنشاء مواقع ثابتة باستخدام Markdown (مشابه لـ Squarespace أو مبسط لـ WordPress) مع إمكانية الربط بين الصفحات وإضافة صور. يتوفر سطر أوامر (DeltaCTL) للأتمتة.  \n  - **Atlas**: محرك بحث واكتشاف volledig decentralized؛ يستخدم زاحف افتراضي ونموذج لغة كبير لوصف المحتوى بشكل محايد، ويمكن للمستخدم اختيار الزواحف والمصنّفات التي يثق بها.  \n  - **Freenet Git**: يسمح بنسخ، سحب ودفع مستودعات Git على الشبكة؛ خطوة نحو forge برمجيات complètement decentralized (مثل GitHub).  \n  - **بريد Freenet (Mail)**، **Raven** (شبكة اجتماعية مشابهة لـ Facebook/X)، **Harvest** (سوق حرفي decentralized مثل Etsy) – كلها في مراحل أولية أو تجريبية.  \n  - **أدوات سطر أوامر** (مثل `riverctl`) لتفعيل التشغيل والتحكم الآلي من خلال السكريبتات أو نماذج اللغة الكبيرة.  \n\n- **سهولة adoption**  \n  - يمكن تجربة Freenet بدون تثبيت عبر زيارة `freenet.org/try` (تشغيل متصفح مباشر يربط بالعقدة التجريبية؛ البيانات الخاصة مشفرة ومخزنة فقط عند الاستخدام).  \n  - للتثبيت الكامل: `freenet.org/quickstart` – العميل بحجم ≈ 11 ميغابايت (مكتوب بلغة Rust). بعد التثبيت يمكن نقل البيانات الخاصة من العقدة التجريبية إلى عقدتك الخاصة بزر “Move to my peer”.  \n\n- **لماذا تم بناء River قبل البريد؟**  \n  - الدردشة grupّة مفيدة даже لعدد قليل من الأصدقاء وتستجيب للتوسع من أصغر حجم إلى أكبر، بينما تحتاج خدمات البريد إلى قاعدة مستخدمين أوسع لتكون ذات فائدة حقيقية.  \n\n- **القدرة على التوسيع والسيطرة**  \n  - العقود يمكن برمجتها لتحديد من يمكنه تعديل البيانات (التوقيع التشفيري) أو قراءتها (التشفير). يمكن دمج التطبيقات بسهولة (مثل ربط Atlas مع River أو دمج Freenet Git مع River لمناقشة تغييرات الكود).  \n  - كل مكون في Freenet متوافق بشكل افتراضي (كـ “Lego”)، على عكس معظم خدمات الإنترنت الحالية التي تتعمد عدم التوافق لحماية نماذج أعمالها.  \n\n- **النقطة الأخيرة**  \n  - Freinet لا يهدف إلى替代 كل خدمات الإنترنت فوراً، بل يبيّن أنه يمكن بناء تطبيقات أساسية (دردشة، مواقع، بحث، مستودعات كود، بريد، سوق، شبكة اجتماعية) بطريقة ** completamente decentralized، شفافة، ومقاومة للضغط الحكومي**.  \n  - يدعو المشاهد لتجربة الشبكة عبر الرابط المذكور أو تثبيت العميل والمساهمة في نمو المجتمع المفتوح المصدر حول المشروع.  \n\n---  \n**الخلاصة:** Freenet يقدم بنية تحتية peer‑to‑peer خالية من الخوادم المركزية تجعل الرقابة والسيطرة الحكومية صعبة للغاية، مع توفير شفافية كاملة، أدوات خصوصية قوية (العقود والتمثيليات)، ومجموعة متزايدة من التطبيقات العملية التي يمكن تجربتها فوراً أو تثبيتها بسهولة لتجربة إنترنت أكثر حرية ومقاومة للرقابة."

    "summary": "**ملخص الفيديو (بالعربية):**  \n\nيتحدث الفيديو عن فكرة أن many things in life come in threes – الفطور، الغداء، العشاء؛ المقص، الحجر، الورق؛ البداية، الوسط، النهاية – وكيف أن هذا المبدأ ينطبق أيضًا على الهوايات والأدوار التي نلعبها في الحياة. يروي المتحدث كيف كان يجعل الفيديو هوايته الأولى عندما كان صغيرًا، ثم مع تقدم العمر وتغير الظروف (العمل، المسؤوليات، الصداقات الجديدة) بدأت هذه الهوية تتلاشى لدى الآخرين، بل وحتى لديه نفسه، لأن الطاقة والوقت محدودة ولا يمكن الاعتناء بأكثر من ثلاثة جوانب رئيسية في الحياة في آنٍ واحد (مثلاً: العمل، العائلة، الهواية). عندما تُهمَل أحد هذه الجوانب لفترة كافية، يتوقف الناس عن رؤيتنا بها، ونبدأ نحن أيضًا ننسى تلك النسخة من أنفسنا. لكن الحياة موسمية؛ فبعد فترة انحسار تظهر فرص لاستعادة ما كان مهمًا لنا من جديد. في النهاية، يتعلم المتحدث أن لا تكون هناك نسخة واحدة “الحقيقية” منه، بل يمكنه أن يكون simultaneously “رجل السيارة” لزملائه، “رجل الصالة” لبعض المعارف، و“صانع الفيديو” للأصدقاء القدامى، وأن كل هذه الجوانب تعود بدورها عندما يتغير الموسم في الحياة. \n\nالرسالة الأساسية: نحن محدودون بالطاقة والوقت، لذا نختار عادة ثلاث أولويات رئيسية؛ عندما يتغير أحدها، لا تعني ذلك أننا فقدنا جانبًا من هويتنا، بل إن الحياة تمنحنا مواسم تسمح بعودة ما أهملنا سابقًا، وهويتنا تتشكل من مجموع من نحن كنا، من أصبحنا، ومن ما ينتظرنا عندما يتغير الزمان."

    "summary": "**ملخص الفيديو بالعربية**\n\nفي هذا الفيديو، تحكي CyberYumeo قصتها الشخصية حول كيف أصبحت NEET (أي لا تعمل، لا تدرس ولا تشارك في أي تدريب).  \n\n- بدأت مشكلاتها الصحية في سن 15 عندما ظهرت عليها أعراض تشير إلى اضطراب فصامي غير محدد (من المرجح أن يكون فصامًا)، وتطور schizophrenia).  \n- مع مرور الوقت، تفاقمت الأعراض السلبية للاضطراب (قلة الطاقة، الدافع، والتركيز)، مما أثر على قدرتها على العمل والدراسة.  \n- كانت تعمل في ماكدونالدز وتدرس في الجامعة، لكن الضغط والتعب جعلها تشعر بأنها على verge of الانهيار؛于是 قررت ترك وظيفتها لتجنب الانهيار أمام العملاء.  \n- بعد ترك الوظيفة، وجدت صعوبة في مواصلة الدراسة الجامعية؛ فقد أصبحت خائفة من العالم، من الواجبات، ومن البريد الإلكتروني، وانسحبت إلى نفسها، وقضت معظم وقتها نائمة أو تستلقي على أرضية الحمام لاستعادة طاقتها.  \n- نتيجة لعجزها عن العمل والدراسة، أصبحت تعتمد مالياً على صديقتها السابقة ( ex‑boyfriend)، لكنه لم يعد قادراً على إعالتها، فاضطرت إلى مغادرة السكن والعيش مؤقتاً مع صديق، ثم لجأت إلى مأوى للمشردين لأقل من شهر.  \n- في المأوى، واجهت بيئة فوضوية (قتال، مخدرات، معاملات غير لائقة)،并且 لجأت إلى ارتداء ملابس معينة كانت give her شعورًا بالراحة رغم أن ذلك جذب انتباهًا سلبيًا من الآخرين.  \n- بدأ سلوكها يصبح غير مستقر (صراخ، تقلبات مزاجية حادة)، الأمر الذي دفع صديقتها السابقة إلى اقتراح دخولها مستشفى Psychiatri كنقطة تحول؛ فقد كان المستشفى相比 بالمأوى مكانًا أكثر استقرارًا.  \n- بعد دخولها المستشفى طوعياً، حصلت على تشخيص دقيق ووُصفت لها دواء **أбилиفي (Abilify) بجرعة 20 ملغ**، والذي ساعدها بشكل ملحوظ في تقليل الهلوسات والأوهام وتحسين مزاجها ووظائفها.  \n- بقت في المستشفى النفسي roughly شهر ونصف، وبعد ذلك helped a social worker securing لها إعانات disability (معاش عجز)، مما مكنها من استئجار غرفة في تحت الأرض مع زملاء سكن ومالك.  \n- الآن تشعر بتحسن وتستمتع بحياتها؛ تمارس هوايات مثل القراءة والرسم، وتذهب في نزولات وتسوق للبقالة، وتخطط للحصول على وظيفة جزئية لتجربة قدرتها على العمل مرة أخرى.  \n- الهدف من الفيديو هو توضيح أن essere NEET ليس بالضرورة نتيجة كسل أو رفض العمل، بل قد يكون نتيجة مشاكل صحية نفسية أو جسدية خطيرة؛ وتستدل بأمثلة مثل مرضى فقدان الشهية الشديدة أو المصابين بالفصام الذين قد يتصرفون تحت تأثير أوهام خطيرة.  \n- تناشد المشاهدين إعادة النظر في الصور النمطية عن مرضى الصحة النفسية وتقديم الدعم والمساعدة بدلاً من الحكم عليهم بأنهم “كسلاء” أو “مجانين”.  \n\nفي الخلاصة، توضح CyberYumeo كيف أدت حالتها الصحية النفسية إلى فقدان عملها ودراستها، ثم إلى تجربة homelessness والعلاج النفسي، وإلى تحقيق استقرار جزئي بفضل الدواء والإعانات، وتشجع على فهم أعمق لتحديات أولئك الذين يصبحون NEET due to health reasons."

    "summary": "**ملخص الفيديو (بالعربية):**\n\nفي هذا الفيديو يروي المُنشئ رحلته الذاتية لتعلم الذكاء الاصطناعي وبناء شبكة عصبية خاصة به لتشغيل ماريو في لعبة Super Mario World. يبدأ بشرح كيف تطوّر من عدم معرفته بأي شيء عن الذكاء الاصطناعي إلى إنشاء نموذج تطوري بسيط يتعلم تخفيف سلسلة نصية من خلال اختيار الأفضل وتزاوجها وتطفّرها (مُحاكٍ للانتقاء الطبيعي)، ثم يوضح كيفطبق نفس الفكرة على صواريخ تتطور لتقترب من هدف.\n\nبعد ذلك يشرّح الخطوات التي اتبعها لبناء شبكة عصبية من الصفر: بدأ بعصبية واحدة، ثم انتقل إلى طبقات كاملة باستخدام الجبر الخطي (المصفوفات)، وأضاف طبقة مخفية. لتزويد الشبكة ببيانات اللعبة، استخرج حالة الذاكرة (RAM) الخاصة بلعبته وحولّها إلى شبكة أعداد تُشير إلى الأرض، الأنابيب، الأعداء، وموقع ماريو، ليصبح ذلك المدخل للشبكة.خرج الشبكة يعطي 12 قيمة تمثل احتمالات الضغط على أزرار التحكم، ويُختار الزر ذو القيمة الأعلى في كل إطار.\n\nصمم وظيفة لياقة (fitness) تجمع بين المسافة التي قطعها ماريو، مكافأة لاجتياز المستوى، ونقاط إضافية للسرعة. الشبكات التي تحقق لياقة عالية تتكاثر (يُخلط أوزانها) لتوليد جيل جديد، مع إضافة طفرات عشوائية. بعد عدة محاولات وضبط للوظيفة اللياقية وعدد الخلايا المخفية، نجح في تشغيل تدريب لمدة 24 ساعة أدى إلى تحسن ملحوظ في أداء ماريو.\n\nفي النهاية يعرض النتائج على Seth Bling، الخبير المعروف بشبكات ماريو الذكية، الذي يثني على المشروع ويعطيه تقييم 10/10، معتبراً أن القيمة الحقيقية تكمن في الخبرة التي اكتسبها المُنشئ خلال العملية – تعلم المفاهيم، بنية الشبكات، troubleshooting، وتفاعل مع برمجة الألعاب.\n\nيختتم الفيديو برعاية من أداة مراجعة الكود CodeRabbit التي تساعد في اكتشاف وإصلاح المشاريع البرمجية بسرعة. \n\n**النقاط الأساسية:**\n- تعلم أساسيات الذكاء الاصطناعي والشبكات العصبية ذاتياً.\n- استخدم مفهوم التطور الطبيعي (الاختيار، التوريث، الطفّر) لتحسين حلول بسيطة (تخمين نص) ثم تطبيقه على ماريو.\n- بنى شبكة عصبية ذات طبقة إدخال (208)، طبقة مخفية (ضُبطت تجريبياً)، وطبقة إخراج (12) تتحكم بأزرار اللعبة.\n- صمم وظيفة لياقة تعتمد على المسافة، الانتهاء من المستوى، والسرعة.\n- درّب مجموعة من الشبكات عبر تكاثر واختيار قائم على اللياقة، مع تحسين متكرر للوظيفة اللياقية وبنية الشبكة.\n- حصل على تقييم 10/10 من Seth Bling وأكد أن التجربة نفسها كانت مكافأةً أكبر من النتيجة النهائية."

    "summary": "**ملخص الفيديو: الهندوسية – أقدم ديانة حية في العالم**\n\n1. **العمر والقديمة**  \n   - الهندوسية تعود إلى أكثر من 3500 سنة، ويرجح بعض الباحثين تاريخها إلى 4500 سنة بناءً على evidences من حضارة وادي السند.  \n   - تُعتبر أقدم ديانة مستمرة مقارنة باليهودية (~3000 سنة)، والبوذية (~2500 سنة)، والمسيحية (~2000 سنة).\n\n2. **المعتقدات الأساسية**  \n   - **التناسخ (إعادة incarnation)**: الروح تُولد مرة أخرى حسب karma (أعمال الحياة السابقة)؛ الهدف ليس الاستمرار في الحياة بل الخروج من دورة الولادة والموت (السنسارا).  \n   - **الموكشا (التحرر)**: الاتحاد النهائي للروح الفردية (أتْمان) مع الواقع المطلق/الكوني (براهمن) ينهي سلسلة التناسخ ويحقق السلام الأبدي.  \n   - **اليوغا والتأمل**: وسائل لتطهير العقل، التغلب على الغرور والشهوات، والإدراك المباشر للروح والكون.  \n   - **فلسفة الأوبانشاد**: نصوص فلسفية قديمة (~2500 سنة أو أكثر) تتناول أسئلة وجودية عميقة (ما هو الكون؟ ما هو الروح؟ ما معنى الحياة؟) وتؤكد أن الإدراك الحقيقي يأتي من تجاوز الفكر المنطقي والوصول إلى البصيرة المباشرة.  \n   - **وحدة الوجود (أدڤيتا فِيدَنتا)**: الفكرة الجوهرية التي تقول إن كل شيء — الله، الكون، الإنسان، الذرات — هو تجسيد لواقع واحد لا يتجزأ (براهمن)؛ العقل البشري يدركه كمظاهر منفصلة بسبب الغرور والتعلق بالدنيا.\n\n3. **الآلهة والتنوع**  \n   - الهندوسية تضم ملايين الأشكال الإلهية (تقريباً 30 مليون)، لكنها ليست جميعها آلهة بالمعنى التقليدي؛ كثير منها akin to ملائكة أو قوى كونية ذات وظائف محددة (مثلاً: فارونا – الماء، جانجا – النهر الغانج، سوريـا – الشمس).  \n   - الثالوث الرئيسي: **براهما** (الخالق)، **فيشنو** (الحافظ)، **شيفا** (المدمر)، يرمزان إلى الوظائف الكونية الثلاث: الخلق، الحفظ، التدمير.  \n   - التنوع يؤدي إلى اتجاهات طائفية (فَيشنَوِيّة، شِيفاوية، وغيرها) но جميعها تُعتبر تحت مظلة الهندوسية التي tolerate حتى الملحدين وتنسب جميع الأديان إلى نفس المصدر Brahman.\n\n4. **الممارسات الاجتماعية والثقافية**  \n   - **نظام الطبقات (varna**: يقسم المجتمع إلى أربعة فئات رئيسية (البراهمين – رجال الدين، الكشاتريا – المحاربين، الفايشيا – التجار، الشودرا – العمال) بالإضافة إلى فئة “المنبوذين” (الداليت) خارج النظام. النظام وراثي ومقيد بالحركة الاجتماعية.  \n   - **تقديس البقرة**: تُعتبر البقرة مقدسة ورمزية للطيبة والعطاء؛ معظم الهندوس يتجنبون أكل لحم البقر، ويعتبرونها رمزًا للحياة والرحمة، رغم وجود خلافات حول مدى قدسيتها.  \n   - **المشروبات المخدرة (السوما)**: في العصور المبكرة استخدم الهنود مشروبًا معدًا من نباتات معينة (يُصنف اليوم ضمن السايسيكيلات) لتجارب روحية عميقة؛ يُعتقد أنه لعب دوراً في نشأة بعض التقاليد الدينية.\n\n5. **التسامح واللاConflict الديني**  \n   - عبر التاريخ لم تشهد الهندوسية حروباً دينية داخلية؛ لم تُفرض ديانتهم على الآخرين، وكانوا يقبلون даже بلا boذا (الذي أنكره الهندوسيون أصلاً) كشخصية مقدسة ضمن طيفهم.  \n   - هذا التسامح يُقابل اليوم بصراعات طائفية (هندوس‑مسلمون) تُظهر أن التعصب يمكن أن يظهر في أي مجتمع، بينما تُظهر التراث التاريخي للهندوسية إمكانية coexistence السلمية.\n\n6. **النصوص المقدسة**  \n   - **الفيـדות** (أربعة مجموعات): أقدم النصوص الهندوسية، تضم ترانيم، طقوس، وفلسفة.  \n   - **الأوبانشاد**: نصوص فلسفية تأملية تُعنى بواقع الروح والكون.  \n   - **البورانا**: كتب أسطورية وتاريخية تتحدث عن آلهة وقصص خَلْق.  \n   - **الملاحم الشعرية** (الرامايانا والمهابهاراتا): أكبر ملحمة في تاريخ البشرية (יותר من 200 ألف بيت) وتقدم قصصاً أخلاقية وروحية للشعب.\n\n7. **الاستنتاج العام**  \n   - الهندوسية ليست ديناً موحداً بل مجموعة متنوعة من المعتقدات، الفلسفات، والممارسات التي تشترك في مفاهيم أساسية مثل التناسخ، الكارما، السعي للموكشا، وتقديس الحياة (특히 البقرة).  \n   - تنوعها ومرونتها جعلتها قادرة على استيعاب تيارات فكرية مختلفة وحتى قبول الملحدين، وهو ما يميزها عن الديانات الإبراهيمية التي تميل إلى وجود حدود عقائدية أكثر وضوحاً.  \n\nبهذا الملخص يتضح أن الهندوسية تمثل أقدم ترانس legado روحي وفلسفي لا يزال يؤثر على تفكير الملايين حول العالم من خلال تأملاته في الوحدة، الروح، والهدف النهائي للتحرر من دائرة الوجود المادي."

    "summary": "**ملخص الفيديو \"Programming Thinking\" بالعربية**\n\n- **مقدمة**  \n  - لا يزال التفكير في البرمجة ضروريًا حتى مع وجود الذكاء الاصطناعي؛ فالمعرفة الأساسية (مثل الرياضيات) تُعزز القدرة على طرح أسئلة أفضل واستغلال الذكاء الاصطناعي بأقصى قدر.  \n  - يُظهر الفيديو أن التفكير في البرمجة هو “المنطق السليم الجديد” الذي يساعد على تعظيم استخدام الأدوات الذكية.\n\n- **المتغيّرات (Variables)**  \n  - علامة المساواة `=` في البرمجة فعل (verb) لتخزين قيمة في متغيّر، لا علاقة لها بالمساواة الرياضية.  \n  - المتغيّر يمكن أن يحمل أي نوع بيانات (عدد، نص، منطقي، قائمة…).  \n  - يمكن إعادة تعريفه وتغيير قيمته أثناء التنفيذ.  \n  - أمثلة: تخزين نصف قطرkreis، تعديل قيمة المتغيّر بدلاً من تعديل كل ظهور للثابت في الكود.  \n  - تم عرض six أسئلة قصيرة لتوضيح سلوك المتغيّر، مثل إعادة التعيين، النسخة بالقيمة مقابل النسخة بالمرجع، وتغيير النوع، وأهمية تعريف المتغيّر قبل الاستخدام، وتبادل القيم باستخدام متغيّر مؤقت.\n\n- **التسمية**  \n  - يجب أن تكون أسماء المتغيّرات ذات معنى ولا تحتوي على مسافات (يُستبدل بالشرطة السفلية) ولا تبدأ برقم.\n\n- **البُنى الشرطية (if, else, elif) وقيم بولين (Boolean)**  \n  - القيم المنطقية `True` و`False` تُسمّى على اسم جورج بول.  \n  - تُستخدم مع عبارات الشرط (`if`, `elif`, `else`) لاتخاذ قرارات objetivo.  \n  - يُشترط وضع نقطتين `:` ثم مسافة بادئة (either tab or four spaces).  \n  - عوامل المقارنة (`<`, `>`, `==`, `!=`, `<=`, `>=`) تعيد قيمة بولينية.  \n  - عوامل منطقية `and` (كل الشروط صحيحة) و`or` (شرط واحد على الأقل صحيح).  \n  - توضيح مفهوم التقصير (short‑circuiting) في تقييم `and` و`or`.\n\n- **القوائم (Lists)**  \n  - تُنشَأ باستخدام الأقواس المربعة `[]`؛ العناصر مفصولة بفواصل.  \n  - المتغيّر الذي يحمل قائمة يخزّن *مرجعًا* (reference) إلى القائمة الفعلية، وليس نسخة منها.  \n  - العمليات الأساسية: الوصول بالـ index (البدء من 0)، التعديل، الإضافة (`append`)، الحذف (`pop` أو `remove`).  \n  - مثال عملي: تحويل نص كامل لـ “Romeo and Juliet” إلى قائمة كلمات باستخدام lower, replace, split.  \n  - التحقق من وجود عنصر باستخدام المفتاح `in`.\n\n- **الحلقات `for`**  \n  - الغرض: أتمتة التكرار المتكرر على عناصر قائمة أو أي كائن قابل للتكرار (iterable).  \n  - بناء: `for element in iterable:` مع مسافة بادئة.  \n  - المتغيّر داخل الحلقة يظل موجودًا فقط أثناء تنفيذ الحلقة.  \n  - أمثلة: حساب مجموع العناصر، إيجاد أكبر قيمة، إنشاء قائمة أفلام فريدة باستخدام الشرط `not in`.  \n  - **الحلقة غير المباشرة عبر `range`**: عندما نحتاج لتعديل عناصر القائمة نفسها (مثل زيادة الرواتب) أو عندما نريد الاعتماد على الفهرس (مثل تعديل عناصر محددة).  \n  - `range(start, stop)` ينتج أرقامًا من `start` وحتى `stop-1`.  \n  - توضيح الفرق بين الحلقة المباشرة (العنصر نفسه) والحلقة غير المباشرة (الفهرس ثم الوصول للعنصر).\n\n- **الحلقات المتداخلة (Nested Loops)**  \n  - الحلقة الداخلية تكمل دورة كاملة لكل خطوة من الحلقة الخارجية.  \n  - مثال: إنشاء أوراق لعب باستخدام حلقة خارجية لل ranks وداخلية للأ suits.  \n  - عندما يعتمدboundary الحلقة الداخلية على متغيّر الحلقة الخارجية (مثل `range(0, i)`) يصبح السلوك أكثر تعقيدًا لكن مفيد لحالات مثل حساب عوامل متعددة أو إنشاء مثلثات.  \n  - 복잡도는 제곱 형태로 증가 (مثال: حلقة مزدوجة على n donne O(n²)).  \n\n- **الدوال (Functions)**  \n  - تُعرَّف بكلمة `def` ثم اسم الدوال ومعاملاتها بين قوسين.  \n  - داخل الدوال يمكن كتابة أي كود (حلقة، شرط، استدعاء دوال أخرى).  \n  - كلمة `return` تُحدِّد مخرجات الدالة؛ إذا غابت تُعيد الدالة قيمة `None` تلقائيًا.  \n  - الاستدعاء يقيِّم المعاملات أولًا ثم ينفذ جسم الدالة.  \n  - महत्व الفرق بين `print` (يطبع داخل الدالة ولا يُعيد قيمة) و`return` (يُعيد قيمة يمكن استخدامها خارجيًا).  \n  - مفهوم الـ *scope*: المتغيرات المحلية تُبحث أولًا؛ إن لم تُوجد تُبحث في النطاق العالمي. المتغيرات المحلية تختفي عند خروج الدالة.  \n  - مثال على تكوين الدوال (function composition): استدعاء دالة داخل أخرى لحساب مساحة سطح كرة.  \n  - نصيحة: تجعل الدوال الكود أبسط، أقل تكرارًا، وأكثر قراءة؛ كما تشجّع على تجزئة المشكلة إلى دوال صغيرة ذات أسماء وصفية.\n\n- **الاستدعاء بالمرجع والقيمة (Value vs Reference)**  \n  - الأنواع الخفيفة (الأعداد، السلاسل، القيم المنطقية) تُمرَّر بالقيمة: تعديل النسخة لا يؤثر على الأصل.  \n  - الأنواع الثقيلة (القوائم، القواميس، الكائنات) تُمرَّر بالمرجع: تعديل العنصر داخل الدالة يؤثر على الأصل الخارجي.  \n  - توضيح باستخدام مثال تمرير قائمة إلى دالة تعدلها، ثم طباعة القائمة الأصلية لتظهر التغيير.  \n  - السبب: تجنب نسخ كميات هائلة من البيانات (كفاءة الذاكرة والوقت).\n\n- **القواميس (Dictionaries)**  \n  - بنية مفتاح‑قيمة تُنشَأ بالأقواس المتعرّفة `{}`؛ المفتاح يجب أن يكون قابلًا للتجزئة (لا يمكن أن يكون قائمة أو قاموس).  \n  - العمليات الأساسية: الوصول (`dict[key]`), الإضافة/التعديل (نفس الصياغة)، الحذف (`pop(key)` أو `del dict[key]`).  \n  -可以遍历仅keys (`dict.keys()`)،仅values (`dict.values()`)،或同时遍历両方 (`dict.items()`).  \n  - مثال عملي: تخزين أسعار وجبات ماكدونالدز، إضافة موسمية، تعديل الأسعار، حذف عنصر غير متوفر.  \n  - مثال متقدم: عدّ تكرار أسماء شخصيات في رواية هاري بوتر باستخدام قاموس لتخزين العد لكل اسم.\n\n- **التكرارية (Recursion)**  \n  - الدالة التي تستدعي نفسها لحل مشكلة عبر تقسيمها إلى مشكلات أصغر.  \n  - شروط必備:  \n    1. **الحالة الأساسية** (base case) لتوقف الاستدعاء اللانهائي (مثل `factorial(1) = 1`).  \n    2. **الحالة التكرارية** (recursive case) تستدعي الدالة بمعامل أصغر (مثل `factorial(n) = n * factorial(n-1)`).  \n  - أمثلة: حساب factorial، عكس سلسلة نصية.  \n  - شرح تفصيلي لتتبع استدعاءات الدالة باستخدام مفهوم “الإطار” (stack frame) وكيف تُعيد القيم progressivement إلى الأعلى.  \n  - التحذير: دون حالة أساسية سيحدث استدعاء لا نهائي؛ دون تقليل حجم المشكلة لا تصل إلى الحالة الأساسية.\n\n- **الخلاصة العامة**  \n  - التفكير في البرمجة يُمكّن من:  \n    * فهم وتعديل المتغيّرات،  \n    * بناء قرارات منطقية باستخدام الشروط والعوامل،  \n    * التعامل مع القوائم والقواميس كهياكل بيانات مرنة،  \n    * أتمتة التكرار عبر الحلقات (`for`, `while` عبر `range`)،  \n    * تجزئة المنطق إلى دوال قابلة لإعادة الاستخدام،  \n    * الاستفادة من الاستدعاء الذاتي (التكرارية) للمسائل التي تتطلّب تقسيم المشكلة.  \n  - إتقان هذه المفاهيم الأساسية يعطيك القدرة على استغلال أدوات الذكاء الاصطناعي بفعالية وتحويل أفكارك إلى برامج ذات تأثير حقيقي.     "summary": "**ملخص الفيديو:**\n\nالفيديو يتحدث عن مكتبة واجهة مستخدم صغيرة جداً تُدعى **Mikra** (ميكرا)، escrita بلغة C وتحتوي على حوالي 1000 سطر فقط. تُصنف المكتبة على أنها **مكتبة وضعٍ فوري (Immediate‑Mode UI)**، أي أنها لا تحتفظ ببنية واجهة مستمرة بل تُصدر أوامر الرسم مباشرةً عند استدعاء الدوال مثل `begin_window`, `label`, `draw_rectangle` وهكذا؛ فالمنطق يتولى تنفيذ هذه الأوامر في نفس الإطار دونneed إلى إنشاء شجرة واجهة وصيانتها.\n\nالنقاط الرئيسية التي تمت مناقشتها:\n\n1. **فكرة الوضع الفوري مقابل الوضع المحفوظ**  \n   - الوضع المحفوظ يتطلب بناء شجرة واجهة ثم передаها إلى محرك للعرض.  \n   - الوضع الفوري (كما في Mikra) يصدر أوامر الرسم مباشرةً؛ يمكن الاحتفاظ ببعض الحالة داخلياً (مثل السياق أو الخطوط) لكن الواجهة تُشعر بأنها فورية.\n\n2. **متطلبات المكتبة**  \n   - المكتبة لا تقوم بأي رسم بنفسها؛ بل تتوقع من المستخدم توفير **Renderer** بسيط قادر على رسم مستطيلات، نص، قصّ (clip)، وأيقونات.  \n   - يجب على المخدم توفير دوال مثل: `r_init`, `r_draw_rect`, `r_draw_text`, `r_get_text_width`, `r_set_clip_rect`, `r_clear`, `r_present` وغيرها.  \n   - يجب أيضاً تحديد دوال لقياس عرض وارتفاع النص (`text_width`, `text_height`) داخل السياق.\n\n3. **هيكل الاستخدام**  \n   - إنشاء سياق (`mu_context`) (يفضل تخصيصه على heap أو كمتغير عام).  \n   - تهيئة السياق وتحديث دوال قياس النص.  \n   - حلقة رئيسية:  \n     * جمع إدخالات الفأرة والماوس عبر `mu_input`.  \n     * استدعاء `mu_begin` لبدء النافذة.  \n     * رسم العناصر باستخدام دوال الواجهة (مثل `mu_label`, `mu_button`, `mu_textbox`, `mu_slider`).  \n     * استدعاء `mu_end` لإنهاء النافذة.  \n     * استدعاء `mu_command_next` لتسلسل أوامر الرسم التي أصدرتها المكتبة وتنفيذها عبرrenderer الموفر.\n\n4. **التحديات والملاحظات**  \n   - واجهة API غير بديهية بعض الشيء (مثل استخدام مؤشر إلى مؤشر لتكرار الأوامر، وعدم توثيق كافٍ).  \n   - لا توجد ملفات make أو تعليمات تجميع صريحة؛ يتوجب على المستخدم توفير دوال הרندر وربطها يدوياً.  \n   - المكتبة تفترض أن المستديم سيوفر خطًا وحجمًا ثابتاً؛ إذا أراد تغيير حجم الخط عليه تحديث دوال قياس ال     "summary": "**ملخص الفيديو (العربية):**\n\nفي المحادثة، يستعرض ستيفن وولفرام فكرته الأساسية بأن الفيزياء التقليدية لا تستطيع وحدها تفسير الكون؛ بل إن الفهم الحقيقي يأتي من رؤية الكون كنتيجة لتطبيق قواعد حسابية بسيطة très بسيطة. يوضح أن تجاربه الحاسوبية في الثمانينيات showed أن قواعد بسيطة (مثل automata الخلوية أو Rule 30) يمكنها أن تولّد سلوكاً معقداً جداً، بل وحتى عشوائيًا في بعض الجوانب، ما يُظهر أن التعقيد لا يتطلب قوانين معقدة مسبقاً.\n\nيشرح وولفرام أن تاريخ الفيزياء في القرن العشرين اعتمد على Formalization رياضي (النسبية العامة، الميكانيكا الكمومية، الإحصاء الحراري)، لكنه ترك العديد من التفاصيل غير المفسرة (كتكوّن الجسيمات، الثوابت الأساسية). لذا انتقل إلى نهج “الحوسبة كعالم”: دراسة ما يحدث عندما نطبق قواعد بسيطة بشكل متكرر، وهو ما يسميه *ruliyology* أو دراسة القواعد وعواقبها. يؤكد أن مختلف النماذج الحسابية (automata الخلوية، آلات تورنغ، المركبات، آلات السجلات) متكافئة؛ أي يمكنها محاكاة بعضها البعض، تماماً كما يمكننا تشغيل نفس البرنامج على عتاد مختلف.\n\nمن هذا المبدأ يستنتج مبدأ **التكافؤ الحسابي**: 대부분의 الأنظمة في الطبيعة تقوم بحسابات ذات مستوى تعقيد مشابه لما يمكن أن تقوم به أدمغتنا، apesar من أن مظهرها قد يختلف. ومن هنا ينشأ مفهوم **عدم القابلية للاختزال الحسابي** (computational irreducibility): لتحديد سلوك نظام بعد عدد كبير من الخطوات لا يمكننا القفز إلى النتيجة دون محاكاة كل خطوة؛ أي أن التنبؤ الدقيق مستحيل في كثير من الحالات، وأن العلم له حدود أساسية تنشأ من هذه الخاصية.\n\nيقدم وولفرام مفهوم **الرولياд (ruliad)** – وهو الحد المجرد لجميع الحسابات الممكنة المتشابكة. فإننا كمراقبين ننظر إلى جزء من هذا الرولياд من خلال عدسة معينة تحدّدها حالتان: być **محدودين حسابياً** (لا يمكننا إجراء حسابات لا نهائية) و**الإيمان بالاستمرارية الزمنية** (نحن ندرك أننا نستمر ككيان واحد عبر الزمن). هذه الخصائص تجعلنا نرى فقط جيوب من القابلية للاختزال داخل الرولياд، والتي نُسمّيها “قوانين الطبيعة”. بمعنى آخر، القوانين التي ن percepها ليست خصائص أساسية للكون فقط، بل هي نتيجة لكيفية رسمنا (كمراقبين) للرولياд.\n\nيستنتج أن ميكانيكا الكم والنسبية العامة تظهر كظواهر تجمع (ensemble) من إعادة كتابة شبكة من ذرات الفضاء وفق قواعد محلية؛ حيث أن تعدد histories الممكنة يؤدي إلى الاحتمالات الكمومية، وCollective effect من إعادة الكتابة يُنتج معادلات أينشتاين للجاذبية. ويرى أن كل قاعدة محتملة تُستعمل في مكان ما من الرولياд؛因而 “قانوننا” ليس قاعدة واحدة נבחرت، بل هو الطريقة التي ندرك بها جزءً من جميع الاحتمالات.\n\nفي الفصل الأخير يناقش معنى الحياة في هذا الإطار: إن عدم القابلية للاختزال الحسابي هو ما يمنح الحياة غنىً ومعنى؛ فإذا كان كل شيء يمكن توقعه مسبقًا، لما كان هناك أي قيمة لتجربة الحياة الفعلية. إن تجربتنا للحياة هي تنفيذ لحساب لا يمكن اختزاله؛ поэтому فإن الحرّ apparent (free will) ينشأ من عدم قدرتنا على حساب النتيجة المسبقة رغم معرفة القواعد الأساسية. يضيف أن نفس المبدأ يحدّد حدود الذكاء الاصطناعي: يمكن للذكاء الاصطناعي أن يكون قادر على مفاجأتنا لأنه أيضا غير قابل للاختزال، وبالتالي لا يمكن ضمان سلوكه المسبق.\n\nأخيرًا، يؤكد أن فهمنا للحساب كطريقة لوصف العالم يفتح آفاقًا لا نهائية للاكتشاف، وأن دورنا كائنات بشرية هو اختيار أي جزء من هذا الكون الحسابي نراه مثيرًا للاهتمام ونضيفه إلى ثقافتنا، تمامًا كما أنشأنا لغاتنا لوصف ما يهمنا. таким образом، فإن رؤية الكون كبرنامج بسيط لا تقلل من عجائبه، بل تكشف أن العجز عن التنبؤ المطلق هو مصدر الثراء والحرية والمعنى في حياتنا."

    "summary": "**ملخص الفيديو (العربية)**  \n\n- **مثال مبكر على نجاح الفاين-تونينغ**: في 2023 درّبت شركة قانونية ذكاءً اصطناعياً مخصصاً بالشراكة مع مختبر فروتير (Frontier Lab). في اختبارات عمياء favour هذا النموذج المُحسّن على GPT‑4 بنسبة 97٪، ما أثبت أن الفاين‑تونينغ يمكن أن يتفوق على النماذج العامة عندما تكون المهمة متخصصة (مثل المستندات القانونية).\n\n- **ما هو الفاين‑تونينغ؟**: يبدأ من نموذج أساس (قاعدة معرفة عامة تم تدريبها على كم هائل من بيانات الإنترنت)، ثم يُستمر التدريب على مجموعة بيانات ضيقة ومتخصصة (عقود قانونية، تذاكر دعم داخلي …) لتصحيح الأوزان وإضافة المعرفة الخاصة، بحيث يصبح النموذج أفضل في مهام محددة.\n\n- **لماذا تراجع فعالية الفاين‑تونينغ اليوم؟**  \n  1. **توسيع نوافذ السياق**: النماذج الحالية تتعامل مع ملايين التوكنز (مثلاً 1 M+)، لذا يمكن إرفاق المستندات ذات الصلة مباشرة في الم provoke بدلاً من دمجها في الأوزان.  \n  2. **نماذج الاستدلال (Reasoning Models)**: تُنفّذ تفكيرًا stepwise thinking time‑of‑inference extended reasoning، إذ يستنتج النموذج الإجابة أثناء الاستدعاء وليس فقط من التدريب السابق.  \n  3. **تحسين الكفاءة وخفض التكلفة**: النماذج العامة أصبحت أسرع وأرخص، مما يجعل تدريب نسخة مخصصة هدفًا متحركًا قد يتفوق عليه الإصدار التالي قبل انتهاء العمل على الفاين‑تونينغ.\n\n- **بدائل لا تلمس أوزان النموذج**:  \n  - **RAG (Retrieval‑Augmented Generation)**: استخراج المستندات ذات الصلة في وقت الاستعلام وإضافتها إلى الم provoke.  \n  - **هندسة السياق (Context Engineering)**: تصميم prompt متقن يجمع بين system prompt، البيانات ذات الصلة، وإرشادات التنسيق.  \n  - **مهارات الوكلاء (Agent Skills)**: ملفات MD تحتوي على معرفة إجرائية (كيفية تنفيذ مهمة، الأدوات اللازمة) تُحمَّل عند الحاجة، sodass يمكن للنموذج العام استخدام هذه “المهارات” دون تعديل أوزانه.\n\n- **متى لا يزال الفاين‑تونينغ مفيدًا؟**  \n  - **LoRA (Low‑Rank Adaptation)**: طريقة فعّالة لتدريب محول صغير (adapter) فوق نموذج الأساس، مع留 معظم الأوزان ثابتة؛ يُستَخدم على نطاق واسع اليوم كشكل من الفاين‑تونينغ الكفء من حيث المعاملات.  \n  - **الحاجة إلى زمن استجابة منخفض (Low latency)**: في التطبيقات الزمنية الحقيقية (مثل مساعد صوتي يجيب على مكالمة)، قد يكون النموذج الصغير المُحسَّن أسرع من نماذج الاستدلال الكبيرة التي تحتاج وقت “تفكير”.  \n  - **التقطير (Distillation)**: استخراج مخرجات عالية الجودة من نموذج ضخم ثم تدريب نموذج أصغر عليها.  \n  - **التعزيز بالتعلم المعزز (Reinforcement Fine‑Tuning, RFT)**: يستخدم عندما يمكن تقييم الإخراج برمجياً (إجابة صحيحة/خاطئة) لتحسين النموذج نحو الإجابات ذاتigher scores.\n\n- **إطار قرار عملي**:  \n  1. ابدأ بنموذج الأساس.  \n  2. حسّن الم provoke وهندس السياق.  \n  3. إذا كانت المعرفة حديثة أو خاصة، أضف RAG.  \n  4. إذا كان الفقدان هو معرفة إجرائية (كيفية القيام بشيء)، أضف مهارات الوكلاء.  \n  5. فقط عندما لا تستطيع هذه الطبقات حل عقدة الأداء (مثل زمن استجابة حرج أوneed لتخصص عميق لا يمكن استرداده عبر السياق)، اللجوء إلى الفاين‑تونينغ (غالباً عبر LoRA أو طرق مشابهة).\n\n- **الاستنتاج**: الفاين‑تونينغ لم يمت، لكن دوره انحسر إلى حالات ضيقة حيث لا تكفي التقنيات التي لا تعدل أوزان النموذج (RAG، هندسة السياق، مهارات الوكلاء، LoRA، التقطير، التعلم المعزز). في معظم السيناريوهات الحديثة، يمكن تحقيق التخصص المطلوب عبر هذه البدائل بأسعار أقل وبمرونة أكبر.  \n\n*ما رأيك؟ هل لا يزال للفاين‑تونينغ مكان في سير عملك؟*شارك رأيك في التعليقات."

    "summary": "الملخص:  \nالفيديو يحتوي على أغنية للفرقة اليابانية «الأربعاء كامبانيلا» بعنوان «ウォーアイニー» (Wo Ai Ni، أي «أنا أحبّك»). تستعمل الأغنية مجازات مستوحاة من لعبة الماهجونغ (مثل termos Riichi, Tenpai, Iishanten, Kokushi Musou) ومن المطبخ الصيني (مثل ma po dou fu, xiao long bao, hui guo rou) لوصف حالة الحبيب التي تتردد بين الاعتراف بالمشاعر والبقاء في غموض. يتحدث السارد عن صعوبة قول «Wo Ai Ni» outright، والشعور بأنه على بعد ورقة واحدة من الفوز (أي近ي من الاعتراف) لكنه لا يعلم إن كان realmente في وضع «Riichi» أم لا، ويشعر بأنه يدور في نفس المكان مثل طبق يسخن demasiado ومهدد بالاحتراق. يطلب من الحبيب أن يجيب بصراحة، ويتخلى عن التافهات، ويواجه الموقف بجدية، معتبرًا أن العلاقة هي «Riichi حب» ويطرح سؤالاً متكررًا: «أي نصفك هو؟» (أي ما هو الجزء الذي يكملني؟). في parts أخيرة، يطرح أسئلة مستوحاة من أسطورة «ينابيع الرجل/الفتاة المغرقة» (春の溺れ人、春の溺れ少女) ليبرز عدم اليقين حول ما سيحدث إذا احتوى القرار على مخاطرة، ويكرر رغبته في البوح بحبه رغم الخوف من الندم إذا بقي الأمر غامضًا.总而言之، الأغنية تعبر عن صراع داخلي بين الرغبة في إعلان الحب بصراحة والخوف من الفشل، مستخدمة رموز الماهجونغ والطبخ لوصف التوتر، المخاطرة، والأمل في الوصول إلى نقطة «الفوز» في العلاقة."
  }
];
// ============================================================

let currentFilter = 'has';
let currentSearch = '';

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function onSearch() {
  currentSearch = document.getElementById('search-input').value.toLowerCase();
  render();
}

function getVideoId(v) {
  if (v.videoId) return v.videoId;
  const m = v.url?.match(/(?:v=|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : null;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text ?? '';
  return div.innerHTML;
}

function videoPreviewHtml(v) {
  const id = getVideoId(v);
  if (!id) {
    return `<div class="video-preview"><div class="video-preview-placeholder">لا يوجد معاينة</div></div>`;
  }
  const thumb = `https://img.youtube.com/vi/${id}/mqdefault.jpg`;
  return `
    <div class="video-preview" data-video-id="${id}">
      <div class="video-preview-inner">
        <video class="video-preview-player" poster="${thumb}" preload="none" muted playsinline></video>
        <button type="button" class="video-preview-play" aria-label="تشغيل الفيديو"><span>▶</span></button>
      </div>
      <iframe class="video-preview-embed" title="${escapeHtml(v.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
    </div>`;
}

function getFiltered() {
  return DATA.filter(v => {
    const matchFilter =
      currentFilter === 'all' ||
      (currentFilter === 'has' && v.hasTranscript) ||
      (currentFilter === 'no' && !v.hasTranscript);
    const matchSearch =
      !currentSearch ||
      v.title?.toLowerCase().includes(currentSearch) ||
      v.channel?.toLowerCase().includes(currentSearch);
    return matchFilter && matchSearch;
  });
}

function render() {
  const filtered = getFiltered();
  const grid = document.getElementById('videos-grid');
  const empty = document.getElementById('empty-state');

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';
  grid.innerHTML = filtered.map((v, i) => `
    <div class="video-card ${!v.hasTranscript ? 'no-transcript-card' : ''}" style="animation-delay:${i * 0.06}s">
      <div class="video-card-inner">
        <div class="video-main">
          <div class="video-header">
            <span class="video-num">#${String(DATA.indexOf(v) + 1).padStart(2,'0')}</span>
            <div class="video-title">
              <a href="${v.url}" target="_blank" rel="noopener">${escapeHtml(v.title || 'بدون عنوان')}</a>
            </div>
          </div>
          <div class="video-meta">
            ${v.channel ? `<span class="channel-badge"><span class="channel-dot"></span>${v.channel}</span>` : ''}
            <span class="transcript-badge ${v.hasTranscript ? 'has' : 'no'}">
              ${v.hasTranscript ? '✓ transcript' : '✗ no transcript'}
            </span>
          </div>
          <div class="summary-label">الملخص</div>
          <p class="summary-text ${!v.hasTranscript ? 'no-transcript' : ''}">${escapeHtml(v.summary)}</p>
        </div>
        <div class="video-side">
          ${videoPreviewHtml(v)}
          <div>
            <div class="side-label">Video ID</div>
            <div class="video-id-box">${escapeHtml(v.videoId || getVideoId(v) || '—')}</div>
          </div>
          <a class="open-btn" href="${v.url}" target="_blank" rel="noopener">
            ▶ فتح على يوتيوب
          </a>
        </div>
      </div>
    </div>
  `).join('');
}

function updateStats() {
  const total = DATA.length;
  const withT = DATA.filter(v => v.hasTranscript).length;
  const withoutT = DATA.filter(v => !v.hasTranscript).length;
  const channels = new Set(DATA.map(v => v.channel).filter(Boolean)).size;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-transcript').textContent = withT;
  document.getElementById('stat-no-transcript').textContent = withoutT;
  document.getElementById('stat-channels').textContent = channels;

  const now = new Date();
  document.getElementById('timestamp').textContent =
    now.toLocaleDateString('ar-SA') + ' — ' + now.toLocaleTimeString('ar-SA', {hour:'2-digit', minute:'2-digit'});
}

document.getElementById('videos-grid').addEventListener('click', (e) => {
  const btn = e.target.closest('.video-preview-play');
  if (!btn) return;
  const box = btn.closest('.video-preview');
  const id = box?.dataset.videoId;
  if (!id || box.classList.contains('is-playing')) return;
  const iframe = box.querySelector('.video-preview-embed');
  iframe.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1`;
  box.classList.add('is-playing');
});

updateStats();
render();
</script>
</body>
</html>
