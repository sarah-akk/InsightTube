    "summary": "\n\n**ملخص الفيديو: “The Paradox of Why AI Code Is Failing Us – 3 Pillars”**\n\n1. **الإنتاج المتزايد للرمز البرمجي**  \n   - الذكاء الاصطناعي يسرّع إنتاج المميزات (مثلاً من 40 ساعة إلى 10 ساعة لكل ميزة).  \n   - انخفاض تكلفة الميزة الواحدة يؤدي إلى بناء عدد أكبر من الميزات لأن الطلب على المميزات يكون **مرنًا** (elastic): كلما انخفض السعر، يزداد الطلب أكثر من انخفاض التكلفة.  \n   - هذه الظاهرة تشبه **مفارقة جيفونز (Jevons paradox)**؛ تحسين الكفاءة لا يقلل الاستهلاك الإجمالي بل يزيده، لذا من المتوقع أن تنفق الشركات أموالًا أكثر على تطوير البرمجيات، وليس أقل.\n\n2. **تعقيد الأنظمة المتولدة**  \n   - مع ازدياد عدد الميزات، يزداد حجم وتعقيد الأنظمة المؤسساتية.  \n   - لتوليد وصيانة هذه الأنظمة، يحتاج الذكاء الاصطناعي إلى فهم السياق الكامل للرمز (context window).  \n   - الحجم الفعلي للنافذة السياقية محدود (مثلاً 128 000 توكن) ويزيد التعقيد مع نمو النظام، مما يخلق حلقة تغذية راجعة ذاتية: كلما زاد الكود، زاد العبء على الذكاء الاصطناعي لفهمه، وزادت الأخطاء المحتملة.\n\n3. **قيود آلية الانتباه (Attention) في النماذج**  \n   - كل توكن يُحوَّل إلى متجه عالي الأبعاد ويُعدَّل عبر آلية الانتباه التي تجمع معلومات من التوكنات السابقة.  \n   - التعقيد الحسابي للانتباه هو **O(n²)**؛ مضاعفة حجم النافذة تُربّع عدد المقارنات المطلوبة، ما يجعل النوافذ الكبيرة مكلفة للغاية.  \n   - حتى مع نوافذ كبيرة، تظهر مشكلة **\"Lost in the Middle\"**: النماذج تميل إلى التركيز على بداية ونهاية النص وتهمل المعلومات الموجودة في الوسط، مما قد يؤدي إلى إغفال تفاصيل حرجة داخل النافذة نفسها.\n\n4. **الحلول المقترحة ومحدودياتها**  \n   - **الانتباه النادر (Sparse Attention)**: يقلل عدد المقارنات عبر اختيار مجموعة فرعية من التوكنات، لكنه قد يفوت وصلات مهمة بين المكونات.  \n   - **الاسترجاع (Retrieval)**: وضع قاعدة الكود في فهرس خارجي والبحث عن Dependencies عند الحاجة. ومع ذلك، إذا لم يكن هناك إشارة صريحة في الكود الذي يُحدَّثه النموذج، لن يجد الفهرس зависимости مخفية (مثلاً وحدة تقارير ليلية لا تُستدعى مباشرةً)، ما يؤدي إلى أخطاء غير ظاهرة مثل تطبيق خصم مرتين أو تعقيد زمني غير متوقع (تحويل عملية خطية إلى تربيعية).  \n   - كل هذه الطرق تخفف من العبء الجزئي لكنها لا تزيل المشكلة الأساسية: **النموذج لا يستطيع الاحتفاظ بتمثيل كامل ومتوازن للنظام الضخم الذي يولده**.\n\n5. **الاستنتاج الرئيسي**  \n   - زيادة سرعة إنتاج الكود عبر الذكاء الاصطناعي تؤدي إلى طلب أكبر على الميزات (مرونة الطلب) وتوليد أنظمة أكثر تعقيدًا.  \n   - حدود نموذج الذكاء الاصطناعي (حجم النافذة السياقية، تعقيد الانتباه O(n²)، ظاهرة “Lost in the middle”) تجعل من الصعب عليه فهم وصيانة هذه الأنظمة المتضخمة.  \n   - النتيجةaparadoxية: على الرغم من أن الذكاء الاصطناعي يُسرّع التطوير، فإننا ننتهي بإنفاق المزيد من المال والوقت وصعوبة أكبر في الحفاظ على جودة الأنظمة – أي أن الأداة التي يفترض أن تبسط العملية تصبح بدورها مصدرًا لتعقيدها وفشلها.\n\nبهذا образом، يوضح الفيديو أن **المفارقة ليست في جودة الكود المولَّد**، بل في **كيف أن زيادة الكفاءة تؤدي إلى طلب أكبر وتعقيد يفوق قدرة النماذج على الفهم والسيطرة**. استيعاب هذه الظواهر الثلاث (مرونة الطلب، مفارقة جيفونز، وحدود الانتباه والسياق) هو المفتاح لتوقع ومعالجة التحديات المستقبلية لتطوير البرمجيات بمساعدة الذكاء الاصطناعي."

    "summary": "\n\n**ملخص الفيديو بالعربية**\n\nيتحدث الفيديو عن خطر الاعتماد المفرط على الذكاء الاصطناعي وتأثيره على قدراتنا العقلية، موضحاً أن ما يُطلق عليه “ضمور المعرفي” (cognitive atrophy) يؤدي إلى فقدان المهارات الأساسية مثل حل المشكلات، التفكير النقدي والإبداع. عندما نٌسْلِم جميع الأعمال الذهنية للأدوات الذكية دون تساؤل، نصبح أقل فضولاً وتقل قدراتنا الإنسانية، ما يهدد تقدم المجتمع ككل.\n\nيظهر المتحدث أن المحتوى المُنتج بواسطة الذكاء الاصطناعي بات يقترب في الكم من المحتوى البشري، وأن القنوات التي تنشر “الغُبار الذكائي” (AI slop) حصدت مئات الملايين من المشاهدات (أكثر من 40 مليار مشاهدة)، وهو ما يعادل أكثر من 13 عاماً من إنتاج قناة كورزجيساغت. وأصبح distinguishing AI‑generated content شبه مستحيل، مما يزيد من صعوبة منافسة المبدعين البشريين أمام هذا السيل اليومي من المحتوى المُولد آلياً.\n\nرغم هذه التحديات، تؤكد كورزجيساغت على مهمتها الأساسية: إثارة الفضول وتعزيز رؤية علمية، إنسانية ومتفائلة من خلال استثمار الوقت والجهد في البحث، الرسم والرسوم المتحركة لتقديم فيديوهات علمية مجانية للجميع. وتشير إلى أن التمويل لا يأتي solely من الرعاة والإعلانات؛ بل يعتمد بشكل كبير على متجر القناة، وبشكل خاص على مبيعات **التقويم البشري** (Human Era Calendar).\n\nيصف الفيديو هذا التقويم كمشروع شغوف يغيّر طريقة حساب الزمن، حيث يبدأ العد من 12 000 سنة مضت (مع dawn of civilization) بدلاً من 2000 سنة. كل شهر يقدم عملاً فنياً سحرياً يستعرض أساطير وحكايات قديمة ساعدت البشرية على فهم العالم قبل ظهور العلم، مثل قصص تaming البراكين، كائنات أسطورية مستوحاة من الحفريات الأولى، وغيرها. يُؤكد أن هذه الرسومات והאהבה التي تُصبّ في كل تفاصيلها لا يمكن للذكاء الاصطناعي تقليدها.\n\nفي الختام، يوجه فريق كورزجيساغت شكره للمشاهدين ودعوتهم لدعم القناة عبر شراء التقويم أو أي منتجات من المتجر، مع التأكيد أن هذا الدعم هو ما يتيح استمرار إنتاج المحتوى العلمي المجاني والمحافظة على روح الإبداع الإنساني."

    "title": "10 open source tools that feel illegal...",
    "url": "https://www.youtube.com/watch?v=Ukt2gVz25PQ",

    "videoId": "Ukt2gVz25PQ",
    "hasTranscript": true,
    "summary": "\n\n**ملخص الفيديو (بالعربية):**  \nيتحدث الفيديو عن عشر أدوات مجانية ومفتوحة المصدر تُستَخدم في اختبار الاختراق الأخلاقي وتكون متوفرة على نظام Kali Linux، مع تحذيرٍ قويٍ من استخدامها دون إذن وتوضيح أن الاستخدام غير المصرّح به قد يخرق القوانين الدولية ويؤدي إلى السجن. بعد تقديم هذا التحذير، يشرح المُقدّم الأدوات على النحو التالي:\n\n1. **Nmap (يُكتب في الفيديو كـ “end mapap”)** – أداة لفحص الشبكات وتحديد المنافذ المفتوحة ونظام التشغيل لاكتشاف الثغرات.  \n2. **Wireshark** – برنامج لتحليل الحزم على مستوى دقيق، يتيح مراقبة حركة الشبكة وتحديد الاتصالات المشبوهة.  \n3. **Metasploit** – إطار عمل متكامل يوفّر استغلالات جاهزة (مثل Eternal Blue) لتنفيذ هجمات مثل الحصول على shell عكسي على أجهزة هدف.  \n4. **Aircrack-ng** – أداة لاختراق شبكات Wi‑Fi وفك تشفير مفاتيح WPA/WPA2 عبر capturing الحزم وتحليلها.  \n5. **Hashcat** – برنامج كسر كلمات المرور المشفّرة (hashes) باستخدام تقنيات brute force أو قواميس مثل rockyou.txt، مع توضيح أن الهاشات الحديثة (مثل bcrypt) تحتاج وقتاً أطول.  \n6. **Skipfish** – مسحّ تطبيقات ويب يزحف recursively إلى الموقع ويكشف عن ثغرات مثل XSS وSQL injection، ويُمكنه استخدام بيانات اعتماد مُسروقة لاستكشاف الأجزاء العميقة من الموقع.  \n7. **Foremost** – أداة استرداد بيانات جنائية (file carving) تستعيد الملفات المحذوفة من صور الأقراص حتى لو كان النظام قد تم تنسيقه rápidamente.  \n8. **SQLmap** – يكشف عن قواعد بيانات مواقع ويب ويتيح تنفيذ هجمات حقن SQL لاستخراج أو تعديل البيانات.  \n9. **hping3** – يُستَخدم لإرسال حزم Flood ( DOS/DDoS ) لاستنزاف موارد الخادم أو إغراقه بالحركة.  \n10. **Social Engineering Toolkit (SET)** – مجموعة لتصميم هجمات الهندسة الاجتماعية عبر البريد، SMS، QR codes، أو استنساخ مواقع لخداع الضحايا والحصول على بياناتهم.\n\nويُظهر الفيديو cómo يمكن تثبيت Kali Linux على خادم افتراضي خاص (VPS) عبر Hostinger (الراعي) والاتصال به عبر SSH لبدء التجربة. كما يُنصح بتثبيت الأدوات بشكل منفصل أو استخدام نسخة Kali الكاملة، ويُؤكد على ضرورة الحصول على إذن صريح قبل إجراء أي اختبار اختراق، لأن استخدامها بدون موافقة يُعتبر غير قانوني ويمكن أن يؤدي إلى عواقب قانونية وجنائية خطيرة. في الختام، يحث المشاهد على الإعجاب بال vídeo والاشتراك لمزيد من المحتوى البرمجي الآمن والأخلاقي."

  {
    "title": "The Insane Engineering of Fiber Optics",
    "url": "https://www.youtube.com/watch?v=NiCgcUTL9_Q",
    "channel": "Veritasium",
    "videoId": "NiCgcUTL9_Q",
    "hasTranscript": true,
    "summary": "\n\n**ملخص الفيديو بالعربية**\n\nيتحدث الفيديو عن تطور وتطوير ألياف الألياف الضوئية من تجاربٍ أوليةٍ في أواخر القرن التاسع عشر إلى التقنية التي تدعم الإنترنت اليوم.\n\n1. **التجربة المبكرة**  \n   - في عام 1887، استخدم معلم فيزياء قضيبًا زجاجيًا رفيعًا مثبتًا على سهم قوسٍ لتحديد قوىٍ صغيرة؛ لاحظ أن الضوء يمكن أن يُحْبَس داخل الزجاج حتى مع الانحناءات الحادة.\n\n2. **لماذا احتجت الشركات الهاتفية إلى أليافٍ ضوئية**  \n   - بين 1960 و1973 تضاعف عدد المكالمات الهاتفية في الولايات المتحدة من 285 مليون إلى 576 مليون مكالمة يوميًا.  \n   - الأسلاك النحاسية عانت من خسارة عالية عند تردداتٍ مرتفعة بسبب التيارات الدوامية (eddy currents) التي تحد من مدى الإشارات، وكانت تتطلب مضخمات كل几 كيلومترات.\n\n3. **نظرية شانون‑هارتلِي**  \n   - تحدّدت سعة القناة بقدرة الإشارة والضوضاء وعرض التردد؛ لزيادة السعة كان لا بد من زيادة عرض التردد، لكن النحاس وصل إلى حدوده.\n\n4. **الضوء كمجالٍ للترددات العالية**  \n   - الضوء المرئي يقع في نطاق تera‑هرتز، ما يوفر عريضًا هائلًا لنقل البيانات.  \n   - العائقان الرئيسيان:  \n     - نقص مصدر ضوء قوي (حُّل باختراع الليزر عام 1960 على يد تايدور مايمان).  \n     - ضعف شفافية الزجاج (فقدان إشارة كبير).\n\n5. **تشارلز kao وتشخيص الفقدان**  \n   - kao تساءل لماذا يكون الفقدان في الزجاج هائلاً (≈1000 ديسيبل/كم) وهل هو داخلي أم بسبب شوائب.  \n   - حدد أن الفقدان يعود إلى شيئين: **تشتت رايلي** (بسبب بنية الزجاج غير البلورية) و**امتصاص** من أيونات معادن شوائب (مثل الحديد).  \n   - أظهر أن تنقية الزجاج وإزالة الشوائب يمكن أن يخفض الفقدان إلى مستوى يقارن بالنحاس (<20 ديسيبل/كم).\n\n6. **إثبات النظرية**  \n   - kao استخدم **السيليكا النقية fused silica** (ص dioxide نقي) وطور أداة دقيقة لقياس الفقدان على أطوالٍ قصيرة (<30 سم).  \n   - بعد تحسين الجهاز، ثبت أن الفقدان أقل من 5 ديسيبل/كم، ما جذب اهتمام مختبرات الاتصالات worldwide.\n\n7. **تطوير ألياف عملية في كورنغ**  \n   - روبرت ماورر وفريقه (بيتر شولتز ودونالد كيك) اختاروا منهجية معاكسة: استخدموا السيليكا النقية كغلاف (cladding) وأضافوا أكسيد التيتانيوم (أو لاحقًا الجرمانيوم) لزيادة معامل الانكسار في القلب (core).  \n   - استخدموا تقنية **التحلل باللهب** (flame hydrolysis) لصنع بودرة سيليكا نقية ثم ترسيبها داخل أنبوب سيليكا نظيف لتشكيل **preform** (القالب الذي يُسحب إلى ألياف).  \n   - بعد تحسينات سحب (draw) وعلاج حراري، ottenوا أول ألياف منخفضة الفقدان (~16.9 ديسيبل/كم) ثم senere ألياف جرمانيوم بخسارة ~4 ديسيبل/كم، والتي اعتبرت أول ألياف عملية فعلاً.\n\n8. **التحسينات اللاحقة والنشر العالمي**  \n   - بحلول 1977 جربت AT&T أول كابل ضوئي تحت شوارع شيكاغو.  \n   - في أوائل الثمانينيات انخفض الفقدان إلى 0.2 ديسيبل/كم (القيمة المستخدمة حتى اليوم).  \n   - أول كابل ضوئي عابر للمحيط الأطلسي جرى تركيبه عام 1988 ونقل 40,000 مكالمة simultaneous — عشرة أضعاف ما كان يحمله الكابل النحاسي السابق.\n\n9. **كيف تنقل الألياف الضوئية الإشارة**  \n   - تحويل الصوت إلى عيّنات رقمية (PCM) ثم إلى تسلسل من الثوابت والصفر.  \n   - الليزر يضيء للرقم 1 ويطفئ للرقم 0 بنبضات تصل إلى 280 مليون نبضة/ثانية.  \n   - يمكن دمج multiple conversations بطريقة شبيهة بسحاب (zipper) وتجميعها في نفس الألياف، ثم إعادة بنائها في المستقبل باستخدام توقيت أخذ العينات.\n\n10. **التأثير على الإنترنت والتقنيات اللاحقة**  \n   - سعة الألياف الضوئية مكّنت من نقل النصوص، الصور، والفيديو، وخلقت foundation للإنترنت الحديث.  \n   - مع تزايد الطلب، pojawiء **المضخمات الضوئية** (optical amplifiers) التي عززت الإشارات على مسافات طويلة دون تحويلها إلى كهرباء، ما زاد سعة الشبكات البرية والبحرية.\n\n11. **إرث تشارلز kao**  \n   - حصل على جائزة نوبل في الفيزياء عام 2009 عن مساهماته في تطوير الألياف الضوئية.  \n   - أشار إلى أن ثورة المعلومات في التسعينيات لم تكن ممكنة دون هذه الألياف.\n\n12. **الختام**  \n   - يبرز الفيديو أن الابتكار جاء من أفراد فكروا خارج الصندوق (kao كمهندس كهرباء وليس عالم مواد، وماورر وفريقه الذين تبنوا فكرة غير بديهية).  \n   - يُشجع على مواصلة التساؤل عن حدود المواد والتقنيات، لأن المستقبل قد يحمل تحسينات مماثلة لما حققته الألياف الضوئية.  \n\nبهذا ملخص يوضح كيف تحولت فكرةٌ بسيطةٌ باستخدام قضيب زجاجي إلى بنية تحتية عالمية تحملpetabytes من البيانات كل ثانية، مكنّت من الاتصالات الفورية والإنترنت كما نعرفه اليوم."

    "hasTranscript": true,
    "summary": "\n\n**ملخص الفيديو بالعربية:**\n\n- **ما هو GPU؟**  \n  GPU (وحدة معالجة الرسوميات) هو معالج مكون من مئات الأنوية التي يمكنها تنفيذ العديد من العمليات **بشكل متوازٍ**، على عكس الـ CPU الذي يحتوي على عدد قليل من الأنوية ويعمل بشكل تسلسلي (عملية واحدة في كل مرة).\n\n- **الفرق بين GPU و CPU**  \n  - CPU: قلائل من الأنوية → معالجة متسلسلة → مناسبة للمهام العامة.  \n  - GPU: مئات الأنوية → معالجة متوازية → يسرّع بشدة العمليات التي تتطلب قدرًا كبيرًا من الحساب المتوازي (مثل الرسوميات، التعلم العميق، الحوسبة العالية الأداء).\n\n- **لماذا نحتاج إلى GPU؟**  \n  عندما تتطلب التطبيقات قدرًا كبيرًا من الحوسبة المتوازية لا يستطيع الـ CPU إنجازها بكفاءة، يتم نقل تلك الأجزاء إلى الـ GPU كقوة “عضلية” إضافية.\n\n- **حالات الاستخدام الرئيسية**  \n  1. **VDI (البنية التحتية لسطح المكتب الافتراضي):** تمكين تشغيل تطبيقات رسومية ثقيلة (مثل CAD ثلاثي الأبعاد، رسوم متحركة) من سحاب بعيد وكأن الخادم بجانب المستخدم.  \n  2. **الذكاء الاصطناعي (AI):**  \n     - *تعلم الآلة* (استنتاج) و*التعلم العميق* (تدريب الشبكات العصبية) تحتاج إلى معالجة متوازية ضخمة؛ GPUs مُحسّنة خصيصًا لهذه المهام.  \n  3. **الحوسبة العالية الأداء (HPC):** توزيع الأحمال الثقيلة على عدة عقد؛ إضافة GPU تُسرّع المهام مثلrendering، النماذج المحاكية، وتحليل البيانات الضخمة.\n\n- **أهمية استخدام GPU على السحابة**  \n  - **تحديث مستمر:** تصدر شركات مثل Nvidia و AMD نسخة جديدة من GPU تقريباً كل سنة؛ السحابة تسمح للشركات بالحصول على آخر الإصدارات دون استثمار كبير في الأجهزة المحلية.  \n  - **مرونة التكلفة:** نماذج دفع حسب الاستخدام (ساعيًا أو شهريًا) على خوادم Bare Metal أو افتراضية؛ لا توجد تكاليف اهتلاك للأجهزة غير المستخدمة.  \n  - **الأداء:** السحابة توفّر قدرة حسابية قابلة للتوسيع بسرعة، ما يتيح التركيز على الناتج (النتيجة) بدلاً من صيانة الأجهزة ومواكبتها.\n\n- **الخلاصة**  \n  GPU هو معالج متوازٍ يسرّع المهام التي تتطلب رسوميات كثيفة أو تعلم عميق أو حسابات عالية الأداء. استخدامه على السحابة يوفّر تحديثًا تقنيًا مستمرًا، تكلفة مرنة بناءً على الاستهلاك، وأداءً عاليًا يساعد المؤسسات على تحقيق نتائج أفضل دون عناء utrzymain الأجهزة المحلية.  \n\n*للمزيد من التفاصيل، يمكن مراجعة الروابط الواردة في وصف الفيديو والاشتراك للقناة للحصول على محتوى مشابه مستقبلي.*"

// ============================================================

let currentFilter = 'has';
let currentSearch = '';

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function onSearch() {
  currentSearch = document.getElementById('search-input').value.toLowerCase();
  render();
}

function getVideoId(v) {
  if (v.videoId) return v.videoId;
  const m = v.url?.match(/(?:v=|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : null;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text ?? '';
  return div.innerHTML;
}

function videoPreviewHtml(v) {
  const id = getVideoId(v);
  if (!id) {
    return `<div class="video-preview"><div class="video-preview-placeholder">لا يوجد معاينة</div></div>`;
  }
  const thumb = `https://img.youtube.com/vi/${id}/mqdefault.jpg`;
  return `
    <div class="video-preview" data-video-id="${id}">
      <div class="video-preview-inner">
        <video class="video-preview-player" poster="${thumb}" preload="none" muted playsinline></video>
        <button type="button" class="video-preview-play" aria-label="تشغيل الفيديو"><span>▶</span></button>
      </div>
      <iframe class="video-preview-embed" title="${escapeHtml(v.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
    </div>`;
}

function getFiltered() {
  return DATA.filter(v => {
    const matchFilter =
      currentFilter === 'all' ||
      (currentFilter === 'has' && v.hasTranscript) ||
      (currentFilter === 'no' && !v.hasTranscript);
    const matchSearch =
      !currentSearch ||
      v.title?.toLowerCase().includes(currentSearch) ||
      v.channel?.toLowerCase().includes(currentSearch);
    return matchFilter && matchSearch;
  });
}

function render() {
  const filtered = getFiltered();
  const grid = document.getElementById('videos-grid');
  const empty = document.getElementById('empty-state');

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';
  grid.innerHTML = filtered.map((v, i) => `
    <div class="video-card ${!v.hasTranscript ? 'no-transcript-card' : ''}" style="animation-delay:${i * 0.06}s">
      <div class="video-card-inner">
        <div class="video-main">
          <div class="video-header">
            <span class="video-num">#${String(DATA.indexOf(v) + 1).padStart(2,'0')}</span>
            <div class="video-title">
              <a href="${v.url}" target="_blank" rel="noopener">${escapeHtml(v.title || 'بدون عنوان')}</a>
            </div>
          </div>
          <div class="video-meta">
            ${v.channel ? `<span class="channel-badge"><span class="channel-dot"></span>${v.channel}</span>` : ''}
            <span class="transcript-badge ${v.hasTranscript ? 'has' : 'no'}">
              ${v.hasTranscript ? '✓ transcript' : '✗ no transcript'}
            </span>
          </div>
          <div class="summary-label">الملخص</div>
          <p class="summary-text ${!v.hasTranscript ? 'no-transcript' : ''}">${escapeHtml(v.summary)}</p>
        </div>
        <div class="video-side">
          ${videoPreviewHtml(v)}
          <div>
            <div class="side-label">Video ID</div>
            <div class="video-id-box">${escapeHtml(v.videoId || getVideoId(v) || '—')}</div>
          </div>
          <a class="open-btn" href="${v.url}" target="_blank" rel="noopener">
            ▶ فتح على يوتيوب
          </a>
        </div>
      </div>
    </div>
  `).join('');
}

function updateStats() {
  const total = DATA.length;
  const withT = DATA.filter(v => v.hasTranscript).length;
  const withoutT = DATA.filter(v => !v.hasTranscript).length;
  const channels = new Set(DATA.map(v => v.channel).filter(Boolean)).size;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-transcript').textContent = withT;
  document.getElementById('stat-no-transcript').textContent = withoutT;
  document.getElementById('stat-channels').textContent = channels;

  const now = new Date();
  document.getElementById('timestamp').textContent =
    now.toLocaleDateString('ar-SA') + ' — ' + now.toLocaleTimeString('ar-SA', {hour:'2-digit', minute:'2-digit'});
}

document.getElementById('videos-grid').addEventListener('click', (e) => {
  const btn = e.target.closest('.video-preview-play');
  if (!btn) return;
  const box = btn.closest('.video-preview');
  const id = box?.dataset.videoId;
  if (!id || box.classList.contains('is-playing')) return;
  const iframe = box.querySelector('.video-preview-embed');
  iframe.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1`;
  box.classList.add('is-playing');
});

updateStats();
render();
</script>
</body>
